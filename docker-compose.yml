services:
  lemon_db:
    image: postgres:15-alpine
    ports:
      - '5432:5432'
    container_name: postgres_db
    env_file:
      - ./.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lemon-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  exercise_api:
    build: ./exerciseAPI
    container_name: exercise_api
    ports:
      - '8000:8000'
    env_file:
      - ./.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DB_HOST}:${DB_PORT}/${POSTGRES_DB}
      - INTERNAL_SERVICE_URL=${INTERNAL_SERVICE_URL}
    depends_on:
      lemon_db:
        condition: service_healthy
    networks:
      - lemon-network
    volumes:
      - .:/app

volumes:
  postgres_data:
    driver: local

networks:
  lemon-network:
    driver: bridge
